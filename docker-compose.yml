services:

  oracle:
    image: gvenzl/oracle-free:${ORACLE_IMAGE_TAG:-23-slim-faststart}
    container_name: hotel-search-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-oracle}
      APP_USER: ${ORACLE_USER:-hotel}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-hotel}
    ports:
      - "${ORACLE_HOST_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  kafka:
    image: apache/kafka:${KAFKA_IMAGE_TAG:-4.2.2}
    container_name: hotel-search-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:${KAFKA_EXTERNAL_PORT:-29092}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build: .
    container_name: hotel-search-app
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: ${ORACLE_SERVICE:-FREEPDB1}
      ORACLE_USER: ${ORACLE_USER:-hotel}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-hotel}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-hotel_availability_searches}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-hotel-search-group}
      KAFKA_LISTENER_CONCURRENCY: ${KAFKA_LISTENER_CONCURRENCY:-1}
      KAFKA_RETRY_INTERVAL: ${KAFKA_RETRY_INTERVAL:-5s}
      KAFKA_RETRY_MAX_ATTEMPTS: ${KAFKA_RETRY_MAX_ATTEMPTS:-60}
      KAFKA_PRODUCER_SEND_TIMEOUT: ${KAFKA_PRODUCER_SEND_TIMEOUT:-10s}
      KAFKA_DLT_SEND_TIMEOUT: ${KAFKA_DLT_SEND_TIMEOUT:-10s}
      SERVER_PORT: ${SERVER_PORT:-8080}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-2}
      HIKARI_IDLE_TIMEOUT: ${HIKARI_IDLE_TIMEOUT:-600000}
      HIKARI_MAX_LIFETIME: ${HIKARI_MAX_LIFETIME:-1800000}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  oracle-data:
