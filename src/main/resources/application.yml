spring:
  application:
    name: hotel-search

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${ORACLE_USER:hotel}
    password: ${ORACLE_PASSWORD:hotel}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}
      properties:
        enable.idempotence: true
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:30000}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:hotel-search-group}
      auto-offset-reset: ${KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.sling.hotel.infrastructure.messaging.kafka.model
        spring.json.value.default.type: com.sling.hotel.infrastructure.messaging.kafka.model.SearchKafkaMessage
    listener:
      ack-mode: record
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

hotel-search:
  kafka:
    topic: ${KAFKA_TOPIC:hotel_availability_searches}
    dlt-suffix: ${KAFKA_DLT_SUFFIX:.DLT}
    retry:
      interval: ${KAFKA_RETRY_INTERVAL:5s}
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:60}
    producer:
      send-timeout: ${KAFKA_PRODUCER_SEND_TIMEOUT:10s}
    dlt:
      send-timeout: ${KAFKA_DLT_SEND_TIMEOUT:10s}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sling.hotel: ${LOG_LEVEL_APP:INFO}
    org.apache.kafka: ${LOG_LEVEL_KAFKA:WARN}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
